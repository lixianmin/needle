# DEV 环境配置 - 只包含与 common.yml 不同的配置

# 日志配置：写进工作目录下的 logs/（gitignored），Shell 的 log.list 读的就是这个目录
logger:
  filter_level: debug          # debug / info / warn / error；写错启动就报错
  # 飞书群机器人的 webhook 地址。**地址即密钥**：仓库里留空，本地用
  # APP_LOGGER__LARK_URL 覆盖（提交真实地址等于把机器人交给所有能读仓库的人）。
  lark_url: ""
  # secret: ""                # 机器人开了「签名校验」才要

# 元数据配置
metadata:
  base_url: res/metadata

server:
  web_port: 5001
  shell_users:
    xmli: 123456

# Shell 面板自己的签名密钥：与业务 JWT 的 auth.secret 分开，两边 token 不能串用。
# PRO 刻意不写，强制 APP_SHELL__SECRET 注入。
shell:
  secret: dev-shell-secret-change-me

redis:
  data_source: 127.0.0.1:6379

# 鉴权（本示例必填；生产用 APP_AUTH__SECRET 覆盖）
auth:
  secret: dev-secret-change-me
