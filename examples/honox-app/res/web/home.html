<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>honox-app 测试台</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #d7dbe3;
        --dim: #8b94a6;
        --ok: #3fb950;
        --warn: #d29922;
        --err: #f85149;
        --accent: #4c8dff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      h2 {
        margin: 16px 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      main {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
        gap: 16px;
        padding: 16px;
        align-items: start;
      }
      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }
      button {
        font: inherit;
        color: var(--text);
        background: #1f242e;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        text-align: left;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--text);
        background: #12151b;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 1px solid var(--accent);
      }
      .auth {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-left: auto;
      }
      #who {
        color: var(--dim);
      }
      #who.on {
        color: var(--ok);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 8px;
      }
      .grid button {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .verb {
        color: var(--dim);
        font-size: 11px;
      }
      .verb.get {
        color: var(--ok);
      }
      .verb.post {
        color: var(--accent);
      }
      a.link {
        font: inherit;
        color: var(--text);
        text-decoration: none;
        background: #1f242e;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
      }
      a.link:hover {
        border-color: var(--accent);
      }
      .free {
        display: grid;
        /* 方法固定 POST 后只剩一列：路径输入框与下面的 body 框同宽 */
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .free textarea {
        grid-column: 1 / -1;
        min-height: 64px;
        resize: vertical;
      }
      .free button {
        grid-column: 1 / -1;
        justify-self: start;
      }
      #meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        min-height: 22px;
        color: var(--dim);
      }
      #status {
        font-weight: 700;
      }
      #status.ok {
        color: var(--ok);
      }
      #status.warn {
        color: var(--warn);
      }
      #status.err {
        color: var(--err);
      }
      pre {
        margin: 8px 0 0;
        padding: 10px;
        min-height: 180px;
        max-height: 46vh;
        overflow: auto;
        background: #12151b;
        border: 1px solid var(--line);
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 24vh;
        overflow: auto;
      }
      #log li {
        padding: 3px 0;
        border-bottom: 1px dashed var(--line);
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hint {
        margin: 8px 0 0;
        color: var(--dim);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>honox-app 测试台</h1>
      <div class="auth">
        <span id="who">未登录</span>
        <input id="user" value="alice" placeholder="用户名" size="8" />
        <input id="password" type="password" value="alice123" placeholder="密码" size="10" />
        <button id="login" class="primary">登录</button>
        <button id="logout">退出</button>
        <a class="link" href="/shell" target="_blank" rel="noreferrer">Shell 面板 ↗</a>
      </div>
    </header>

    <main>
      <section>
        <h2>接口</h2>
        <div class="grid" id="buttons">
          <button data-method="GET" data-path="/health">健康检查</button>
          <button data-method="POST" data-path="/api/v1/bots/get_bots" data-body="{}">全部 bot</button>
          <button data-method="POST" data-path="/api/v1/bots/get_bots" data-body='{"id":1}'>单条 bot</button>
          <button data-method="POST" data-path="/api/v1/bots/get_bots" data-body='{"id":999}'>
            不存在的 bot（404）
          </button>
          <button data-method="POST" data-path="/api/v1/bots/get_bots" data-body='{"id":"abc"}'>
            id 不是数字（400）
          </button>
          <button data-method="POST" data-path="/api/v1/bots/get_bot_name" data-body='{"id":1}'>
            按 id 取名字
          </button>
          <button data-method="POST" data-path="/api/v1/bots/get_bot_name" data-body='{"id":999}'>
            不存在的 bot 取名字（404）
          </button>
          <button data-method="POST" data-path="/api/v1/bots/get_bot_name" data-body="{}">空 body（400）</button>
          <button data-method="POST" data-path="/api/v1/bots/get_bots" data-body="{}" data-auth="0">
            不带 token（401）
          </button>
        </div>
        <p class="hint">
          先点「登录」拿 token 再点这些按钮；最后一个是故意不带 token 的对照组。
        </p>
        <p class="hint">
          「Shell 面板 ↗」是另一个入口：它用 <code>server.shell_users</code> 里的账号密码登录，
          和这里的 JWT 是两套凭据，互不通用。
        </p>

        <h2>自由请求</h2>
        <div class="free">
          <input id="path" value="/api/v1/bots/get_bots" />
          <textarea id="body" placeholder='body（JSON，可空）：{"id":1}'></textarea>
          <button id="send" class="primary">发送</button>
        </div>
      </section>

      <section>
        <h2>响应</h2>
        <div id="meta">
          <span id="status">—</span>
          <span id="rid"></span>
          <span id="took"></span>
        </div>
        <pre id="out">点左边的按钮发一个请求。</pre>
        <h2>历史</h2>
        <ul id="log"></ul>
      </section>
    </main>

    <script>
      // token 与 uid 存 localStorage：刷新页面不用重新登录。这是示例，不处理多标签页同步。
      const TOKEN_KEY = "honox.home.token";
      const UID_KEY = "honox.home.uid";
      const EXP_KEY = "honox.home.exp";

      // 服务端 `app/api/login.ts` 只存离线算好的 passcode：改盐或改密码要两边一起重算。
      // 固定盐只演示「明文密码不出浏览器」，不防重放（见 spec §3）。
      const DEMO_SALT = "needle-demo-salt";

      const el = (id) => document.getElementById(id);
      const state = {
        token: localStorage.getItem(TOKEN_KEY),
        uid: localStorage.getItem(UID_KEY),
        exp: Number(localStorage.getItem(EXP_KEY) ?? 0),
      };

      function renderAuth() {
        const who = el("who");
        if (state.token === null) {
          who.textContent = "未登录";
          who.className = "";
          el("logout").disabled = true;
          return;
        }
        const left = Math.max(0, state.exp - Date.now());
        const minutes = Math.round(left / 60000);
        who.textContent = `uid=${state.uid} · token ${state.token.slice(0, 12)}… · ${minutes} 分钟后过期`;
        who.className = "on";
        el("logout").disabled = false;
      }

      function setStatus(status) {
        const node = el("status");
        node.textContent = status === 0 ? "网络错误" : String(status);
        node.className = status === 0 ? "err" : status < 300 ? "ok" : status < 500 ? "warn" : "err";
      }

      function pushLog(line) {
        const item = document.createElement("li");
        item.textContent = line;
        const log = el("log");
        log.prepend(item);
        while (log.childElementCount > 40) {
          log.lastElementChild.remove();
        }
      }

      /**
       * 发一次请求并把结果画到右侧。
       * `auth: false` 时即使已登录也不带 Authorization——用来演示 401。
       */
      async function call({ method, path, body, auth = true }) {
        const headers = {};
        if (auth && state.token !== null) {
          headers.Authorization = `Bearer ${state.token}`;
        }
        if (typeof body === "string" && body.trim() !== "") {
          headers["Content-Type"] = "application/json";
        }

        const started = performance.now();
        let response;
        let text = "";
        try {
          response = await fetch(path, {
            method,
            headers,
            body: typeof body === "string" && body.trim() !== "" ? body : undefined,
          });
          text = await response.text();
        } catch (error) {
          setStatus(0);
          el("rid").textContent = "";
          el("took").textContent = "";
          el("out").textContent = String(error);
          pushLog(`ERR ${method} ${path} · ${String(error)}`);
          return;
        }

        const took = Math.round(performance.now() - started);
        setStatus(response.status);
        el("rid").textContent = `rid ${response.headers.get("x-rid") ?? "-"}`;
        el("took").textContent = `${took}ms`;

        let shown = text;
        try {
          shown = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
          // 非 JSON（HTML 错误页之类）就原样展示
        }
        el("out").textContent = shown === "" ? "(空响应体)" : shown;
        pushLog(`${response.status} ${method} ${path} · ${took}ms · rid ${response.headers.get("x-rid") ?? "-"}`);
      }

      // SHA-256（FIPS 180-4）。页面要算 passcode，而 crypto.subtle 只在安全上下文
      // （https / localhost）才有——测试台经常用局域网 IP 打开，所以这里自带一份。
      const SHA256_K = new Uint32Array([
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
      ]);

      function rotr(value, bits) {
        return ((value >>> bits) | (value << (32 - bits))) >>> 0;
      }

      function sha256Hex(text) {
        const bytes = new TextEncoder().encode(text);
        // 补 1 字节 0x80 + 8 字节大端 bit 长度，凑成 64 字节的整数倍。
        const total = ((bytes.length + 9 + 63) >> 6) << 6;
        const buf = new Uint8Array(total);
        buf.set(bytes);
        buf[bytes.length] = 0x80;
        const view = new DataView(buf.buffer);
        // 只写长度低 32 位：页面输入的密码不可能到 2^32 bit。
        view.setUint32(total - 4, (bytes.length * 8) >>> 0);

        const h = new Uint32Array([
          0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
        ]);
        const w = new Uint32Array(64);

        for (let offset = 0; offset < total; offset += 64) {
          for (let i = 0; i < 16; i += 1) {
            w[i] = view.getUint32(offset + i * 4);
          }
          for (let i = 16; i < 64; i += 1) {
            const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
            const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
          }

          let v0 = h[0];
          let v1 = h[1];
          let v2 = h[2];
          let v3 = h[3];
          let v4 = h[4];
          let v5 = h[5];
          let v6 = h[6];
          let v7 = h[7];

          for (let i = 0; i < 64; i += 1) {
            const S1 = rotr(v4, 6) ^ rotr(v4, 11) ^ rotr(v4, 25);
            const ch = (v4 & v5) ^ (~v4 & v6);
            const t1 = (v7 + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
            const S0 = rotr(v0, 2) ^ rotr(v0, 13) ^ rotr(v0, 22);
            const maj = (v0 & v1) ^ (v0 & v2) ^ (v1 & v2);
            const t2 = (S0 + maj) >>> 0;

            v7 = v6;
            v6 = v5;
            v5 = v4;
            v4 = (v3 + t1) >>> 0;
            v3 = v2;
            v2 = v1;
            v1 = v0;
            v0 = (t1 + t2) >>> 0;
          }

          h[0] = (h[0] + v0) >>> 0;
          h[1] = (h[1] + v1) >>> 0;
          h[2] = (h[2] + v2) >>> 0;
          h[3] = (h[3] + v3) >>> 0;
          h[4] = (h[4] + v4) >>> 0;
          h[5] = (h[5] + v5) >>> 0;
          h[6] = (h[6] + v6) >>> 0;
          h[7] = (h[7] + v7) >>> 0;
        }

        let hex = "";
        for (const word of h) {
          hex += word.toString(16).padStart(8, "0");
        }
        return hex;
      }

      async function login() {
        // 密码不出浏览器：只发 sha256(盐 + 密码)。用户名给服务端查记录，uid 由服务端定。
        const user = el("user").value.trim();
        const passcode = sha256Hex(DEMO_SALT + el("password").value);
        const response = await fetch("/api/v1/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ user, passcode }),
        });
        const text = await response.text();
        if (!response.ok) {
          setStatus(response.status);
          el("out").textContent = text;
          return;
        }
        const payload = JSON.parse(text);
        state.token = payload.token;
        state.uid = payload.uid;
        state.exp = payload.expiresAt;
        localStorage.setItem(TOKEN_KEY, state.token);
        localStorage.setItem(UID_KEY, state.uid);
        localStorage.setItem(EXP_KEY, String(state.exp));
        renderAuth();
        await call({ method: "GET", path: "/health" });
      }

      function logout() {
        state.token = null;
        state.uid = null;
        state.exp = 0;
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(UID_KEY);
        localStorage.removeItem(EXP_KEY);
        renderAuth();
      }

      // 按钮的请求形状全写在 data-* 上：加一个用例就是加一行 <button>，不用改 JS。
      el("buttons").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-path]");
        if (button === null) {
          return;
        }
        call({
          method: button.dataset.method,
          path: button.dataset.path,
          body: button.dataset.body,
          auth: button.dataset.auth !== "0",
        });
      });

      el("login").addEventListener("click", login);
      el("logout").addEventListener("click", logout);
      el("send").addEventListener("click", () =>
        call({ method: "POST", path: el("path").value, body: el("body").value }),
      );

      renderAuth();
    </script>
  </body>
</html>
